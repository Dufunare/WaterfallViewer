name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust_core: ${{ steps.filter.outputs.rust_core }}
      tauri_rust: ${{ steps.filter.outputs.tauri_rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "rust_core=true" >> "$GITHUB_OUTPUT"
            echo "tauri_rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          frontend=false
          rust_core=false
          tauri_rust=false

          while IFS= read -r path; do
            echo "changed: $path"
            case "$path" in
              .github/workflows/*)
                frontend=true
                rust_core=true
                tauri_rust=true
                ;;
              src/*|tests/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.npmrc|index.html|vite.config.*|tsconfig*.json)
                frontend=true
                ;;
              crates/*)
                rust_core=true
                tauri_rust=true
                ;;
              src-tauri/*)
                tauri_rust=true
                ;;
              Cargo.toml|Cargo.lock|rust-toolchain|rust-toolchain.toml)
                rust_core=true
                tauri_rust=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "rust_core=$rust_core" >> "$GITHUB_OUTPUT"
          echo "tauri_rust=$tauri_rust" >> "$GITHUB_OUTPUT"

  rust-core:
    name: Rust core
    needs: changes
    if: needs.changes.outputs.rust_core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: Format
        run: cargo fmt --manifest-path crates/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path crates/Cargo.toml --workspace

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and refresh lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Commit refreshed pnpm lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "No pnpm lockfile changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(frontend): refresh pixi lockfile"
          git push origin HEAD:"${{ github.head_ref }}"

  tauri-rust:
    name: Tauri Rust
    needs: changes
    if: needs.changes.outputs.tauri_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
