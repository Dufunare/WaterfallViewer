name: Sync Tauri lockfile

on:
  push:
    branches:
      - feat/persistent-metadata-cache

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/persistent-metadata-cache
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate and commit lockfile
        shell: bash
        run: |
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore(rust): refresh Tauri lockfile"
          git push origin HEAD:feat/persistent-metadata-cache
