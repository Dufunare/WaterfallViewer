name: Windows Release Candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-release-candidate.yml

concurrency:
  group: windows-release-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Build Windows x64 NSIS package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS release candidate
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --ci

      - name: Smoke launch native desktop executable
        shell: pwsh
        run: |
          $exe = "src-tauri/target/x86_64-pc-windows-msvc/release/waterfallviewer.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected native desktop executable at $exe."
          }

          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "Native desktop executable exited during startup smoke with code $($process.ExitCode)."
            }

            "- Native startup smoke: passed; release executable remained alive for 8 seconds on the Windows runner." >> $env:GITHUB_STEP_SUMMARY
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

      - name: Smoke install, launch and uninstall NSIS package
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          $installDir = Join-Path $env:RUNNER_TEMP "WaterfallViewer-RC"
          if (Test-Path $installDir) {
            Remove-Item -Recurse -Force $installDir
          }

          # Tauri NSIS supports silent installation with /S. /NS avoids creating
          # shortcuts on the ephemeral CI runner, and /D keeps the install isolated.
          # NSIS requires /D to be the final installer argument.
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/NS", "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($install.ExitCode)."
          }

          $installedExecutables = @(Get-ChildItem $installDir -Recurse -File -Filter "waterfallviewer.exe")
          if ($installedExecutables.Count -ne 1) {
            throw "Expected exactly one installed WaterfallViewer executable, found $($installedExecutables.Count)."
          }

          $installedExe = $installedExecutables[0]
          $process = Start-Process -FilePath $installedExe.FullName -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "Installed application exited during startup smoke with code $($process.ExitCode)."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

          $uninstallers = @(Get-ChildItem $installDir -Recurse -File -Filter "uninstall.exe")
          if ($uninstallers.Count -ne 1) {
            throw "Expected exactly one NSIS uninstaller, found $($uninstallers.Count)."
          }

          $uninstall = Start-Process -FilePath $uninstallers[0].FullName -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "NSIS uninstaller exited with code $($uninstall.ExitCode)."
          }

          Start-Sleep -Seconds 2
          if (Test-Path $installedExe.FullName) {
            throw "Installed application binary still exists after silent uninstall: $($installedExe.FullName)"
          }

          "- Installed-package smoke: passed; NSIS silently installed to an isolated directory, the installed app remained alive for 8 seconds, and silent uninstall removed the app binary." >> $env:GITHUB_STEP_SUMMARY

      - name: Verify package and write checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $installer.Directory.FullName "SHA256SUMS.txt"
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii $checksumPath

          "### Windows release candidate" >> $env:GITHUB_STEP_SUMMARY
          "- Package: ``$($installer.Name)``" >> $env:GITHUB_STEP_SUMMARY
          "- SHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY
          "- Signing: not configured; this workflow produces an unsigned CI release-candidate artifact." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload NSIS release candidate
        uses: actions/upload-artifact@v4
        with:
          name: waterfallviewer-windows-x64-nsis-${{ github.sha }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
